# Use Ctrl-Space as the tmux prefix key.
unbind C-b
set-option -g prefix C-Space
bind-key C-Space send-prefix

# Forward pane focus changes to terminal applications.
set-option -g focus-events on

# Preserve modified keys (including Shift+Enter) so terminal apps can distinguish them.
set-option -g extended-keys on
set-option -g extended-keys-format csi-u

# Allow terminal clipboard integration through tmux.
set-option -g set-clipboard on
set-option -g allow-passthrough on

# Enable mouse support
set-option -g mouse on

# Set history limit to 50,000 lines
set-option -g history-limit 50000

# Vim bindings for copy mode. Select with v and press y to copy the selection
# to the Wayland clipboard for pasting in other apps.
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'wl-copy'

# Start indexes at 1 instead of 0 for windows and panes
# Re-number windows when one is closed
set-option -g base-index 1
set-option -g pane-base-index 1
set-option -g renumber-windows on

# Reload this config with prefix + r.
bind-key r source-file ~/.config/tmux/tmux.conf

# Open new windows and split panes in the active pane's directory.
bind-key c new-window -c "#{pane_current_path}"
bind-key | split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"

# Install plugins with prefix + I.
set-option -g @plugin 'tmux-plugins/tpm'

# Switch between panes in Tmux and Neovim seamlessly with Ctrl + h/j/k/l,
# resize with Alt + h/j/k/l
set-option -g @plugin 'mrjones2014/smart-splits.nvim'

# Theme
set-option -g @plugin 'catppuccin/tmux'
set-option -g @catppuccin_flavor 'frappe'
set-option -g @catppuccin_window_status_style 'rounded'

# Open urls with prefix+u
set-option -g @plugin 'wfxr/tmux-fzf-url'
set-option -g @fzf-url-open 'gio open'

# Initialize TPM. Keep this at the bottom.
run '~/.config/tmux/plugins/tpm/tpm'
