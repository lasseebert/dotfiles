# Use Ctrl-Space as the tmux prefix key.
unbind C-b
set-option -g prefix C-Space
bind-key C-Space send-prefix

# Forward pane focus changes to terminal applications.
set-option -g focus-events on

# Allow terminal clipboard integration through tmux.
set-option -g set-clipboard on
set-option -g allow-passthrough on

# Enable mouse support
set-option -g mouse on

# Set history limit to 50,000 lines
set-option -g history-limit 50000

# Vim bindings for copy mode
set-window-option -g mode-keys vi

# Start indexes at 1 instead of 0 for windows and panes
# Re-number windows when one is closed
set-option -g base-index 1
set-option -g pane-base-index 1
set-option -g renumber-windows on

# Reload this config with prefix + r.
bind-key r source-file ~/.config/tmux/tmux.conf

# Easy to remember split pane shortcuts
bind-key | split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"

# Install plugins with prefix + I.
set-option -g @plugin 'tmux-plugins/tpm'
set-option -g @plugin 'mrjones2014/smart-splits.nvim'

# Initialize TPM. Keep this at the bottom.
run '~/.config/tmux/plugins/tpm/tpm'
